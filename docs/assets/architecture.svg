<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="462" viewBox="0 0 1080 462" role="img" aria-labelledby="title desc">
<title id="title">CloudBin service architecture</title>
<desc id="desc">Clients reach the gateway, which routes HTTP requests to the auth service or object API. Auth uses SMTP, its PostgreSQL database and Redis. The object API uses Redis, its own PostgreSQL database and three disk-backed storage nodes. Migrations prepare both databases.</desc>
