<!DOCTYPE html>
<html>

	<meta charset="UTF-8">
	<title>CloudBin Password Reset OTP</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f8fafc; padding:20px;">
	<div style="max-width:620px; margin:0 auto; background:#ffffff; border-radius:10px; padding:24px; border:1px solid #e2e8f0;">
		<h2 style="margin:0 0 14px; color:#0f172a;">Reset your CloudBin password</h2>
		<p style="color:#334155; margin:0 0 16px;">Use this OTP to continue your password reset request.</p>
		<div style="font-size:30px; font-weight:700; letter-spacing:8px; color:#dc2626; margin:20px 0;">{{.OTP}}</div>
		<p style="color:#334155; margin:0 0 10px;">This code expires in 10 minutes.</p>
		<p style="color:#64748b; font-size:12px; margin:0;">If you did not request a password reset, please ignore this email and secure your account.</p>
	</div>
</body>
