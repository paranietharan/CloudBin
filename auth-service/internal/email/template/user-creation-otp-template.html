<!DOCTYPE html>

	<meta charset="UTF-8">
	<title>CloudBin OTP</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f7fb; padding:20px;">
	<div style="max-width:620px; margin:0 auto; background:#ffffff; border-radius:10px; padding:24px; border:1px solid #e5e7eb;">
		<h2 style="margin:0 0 14px; color:#0f172a;">Verify your CloudBin account</h2>
		<p style="color:#334155; margin:0 0 16px;">Use the one-time password below to complete your account registration.</p>
		<div style="font-size:30px; font-weight:700; letter-spacing:8px; color:#2563eb; margin:20px 0;">{{.OTP}}</div>
		<p style="color:#334155; margin:0 0 10px;">This code expires in 10 minutes.</p>
		<p style="color:#64748b; font-size:12px; margin:0;">If you did not request this email, you can safely ignore it.</p>
	</div>
</body>
